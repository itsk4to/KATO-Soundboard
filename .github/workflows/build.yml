
name: KATO Soundboard Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP and fix source list
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*source.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Không tìm thấy file source ZIP"
          }

          Expand-Archive $zip.FullName -DestinationPath extracted -Force
          $root = Get-ChildItem extracted -Directory | Select-Object -First 1
          if (-not $root) {
            throw "Không tìm thấy thư mục source"
          }

          Copy-Item "$($root.FullName)\*" "." -Recurse -Force

          # Fix miniaudio source file
          $cmake = Get-Content "CMakeLists.txt" -Raw
          $cmake = $cmake.Replace(
            '${miniaudio_SOURCE_DIR}/miniaudio.c',
            'src/miniaudio_impl.cpp'
          )
          Set-Content "CMakeLists.txt" $cmake -Encoding utf8

          # Fix UTF-16 vs UTF-8 device name comparison
          $audio = Get-Content "src/audio_engine.cpp" -Raw

          $insert = @'
          c.dataCallback=Callback; c.pUserData=&ctx;
              std::string nameUtf8;
              if (!name.empty()) {
                  int needed = WideCharToMultiByte(
                      CP_UTF8, 0, name.c_str(), -1,
                      nullptr, 0, nullptr, nullptr
                  );
                  if (needed > 1) {
                      std::vector<char> buffer(
                          static_cast<size_t>(needed)
                      );
                      WideCharToMultiByte(
                          CP_UTF8, 0, name.c_str(), -1,
                          buffer.data(), needed, nullptr, nullptr
                      );
                      nameUtf8.assign(buffer.data());
                  }
              }
          '@

          $audio = $audio.Replace(
            'c.dataCallback=Callback; c.pUserData=&ctx;',
            $insert.Trim()
          )

          $audio = $audio.Replace(
            'if(name==infos[i].name)',
            'if(nameUtf8==infos[i].name)'
          )

          Set-Content "src/audio_engine.cpp" $audio -Encoding utf8

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Prepare installer script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/output | Out-Null

          @'
          #define AppName "KATO Soundboard"
          #define AppVersion "0.1.0"
          #define AppExeName "KATOSoundboard.exe"

          [Setup]
          AppId={{A2D1A3A0-7C20-4B72-8F39-3EAF0B2A1A10}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=KATO
          DefaultDirName={autopf}\KATO Soundboard
          DefaultGroupName=KATO Soundboard
          OutputDir=output
          OutputBaseFilename=KATO-Soundboard-Setup-v{#AppVersion}
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          PrivilegesRequired=admin
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "..\build\Release\{#AppExeName}"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\KATO Soundboard"; Filename: "{app}\{#AppExeName}"
          Name: "{autodesktop}\KATO Soundboard"; Filename: "{app}\{#AppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Run]
          Filename: "{app}\{#AppExeName}"; Description: "Launch KATO Soundboard"; Flags: postinstall nowait skipifsilent
          '@ | Set-Content "installer/KATO-Soundboard.iss" -Encoding utf8

      - name: Create installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc "installer/KATO-Soundboard.iss"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: KATO-Soundboard-Windows-Test
          path: |
            build/Release/KATOSoundboard.exe
            installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
